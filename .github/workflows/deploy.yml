name: Deploy
# 빌드는 GitHub 러너에서 하고(서버 CPU 를 쓰지 않음) 이미지만 GHCR 로 올린다.
# 서버는 받아서 재시작만 한다 → 배포 중에도 사이트가 느려지지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-community
  cancel-in-progress: true # 연달아 푸시하면 마지막 것만 배포
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/lhjwork/letter-community
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* 는 빌드 때 번들에 박힌다. 서버 .env.production 이 빌드 컨텍스트에 없으니 여기서 넘긴다(공개 값)
          build-args: |
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID || 'G-TBS3TRK246' }}
            NEXT_PUBLIC_URL=${{ vars.NEXT_PUBLIC_URL || 'https://letter.seoul.kr' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://letter.seoul.kr' }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,SHA
          script: |
            set -e
            cd /home/ubuntu/letter-projects
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$SHA"
            docker logout ghcr.io
            # 서버 compose 에 image: 가 있든 없든, compose 가 띄우는 이미지 이름에 이번 커밋 이미지를 붙인다
            TARGET=$(docker compose config --images community)
            docker tag "$IMAGE:$SHA" "$TARGET"
            docker compose up -d --no-build community
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SHA: ${{ github.sha }}
